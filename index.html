<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inventory Scan</title>
<meta name="theme-color" content="#16202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventory">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen mobile app; dock-floor slate ground, hi-vis amber for the one action that matters on each screen. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --ink: #16202b;
  --muted: #5b6878;
  --line: #d3dae2;
  --accent: #f2a900;
  --on-accent: #16202b;
  --ok: #1f8a4c;
  --warn: #b85c00;
  --danger: #c0352b;
  --chip: #dfe5ec;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #18222d; --ink: #e8edf2; --muted: #93a1b0; --line: #2a3644;
    --accent: #ffb81c; --on-accent: #16202b; --ok: #3cbf74; --warn: #f0973a; --danger: #ef6a5f; --chip: #223040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #18222d; --ink: #e8edf2; --muted: #93a1b0; --line: #2a3644;
  --accent: #ffb81c; --on-accent: #16202b; --ok: #3cbf74; --warn: #f0973a; --danger: #ef6a5f; --chip: #223040;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen {
  height: 100%; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--ink); color: var(--bg);
}
.topbar h1, .topbar h2 {
  margin: 0; font: 700 1.5rem/1.1 var(--font-display); letter-spacing: .02em; text-transform: uppercase;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topbar .sub { font-size: .8rem; opacity: .75; font-weight: 500; }
.topbar button {
  background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent);
  color: var(--bg); border-radius: 8px; padding: 6px 12px; font-weight: 600;
}
.body {
  flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); font-weight: 600;
}
.btn.primary {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  font: 700 1.3rem/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em;
}
.btn.block { width: 100%; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: .92rem; }
.btn:active { transform: translateY(1px); }

.label {
  font: 700 .78rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}
.field { display: flex; flex-direction: column; gap: 8px; }
.input {
  width: 100%; min-height: 50px; padding: 0 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); font-size: 1.05rem;
}
.input.code { font-family: var(--font-code); text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--chip); font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.scac { font-family: var(--font-code); letter-spacing: .04em; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.code { font-family: var(--font-code); word-break: break-all; }

/* Home */
.list-card {
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center;
  width: 100%; text-align: left; padding: 14px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
}
.scac-tag {
  grid-row: span 2; font: 500 .95rem/1 var(--font-code); padding: 10px 8px; border-radius: 6px;
  background: var(--ink); color: var(--bg); min-width: 64px; text-align: center;
}
.list-card .who { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-card .when { font-size: .85rem; color: var(--muted); }
.list-card .count { grid-row: span 2; text-align: right; font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.list-card .count small { display: block; font: 600 .7rem/1.2 var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); border: 2px dashed var(--line); border-radius: var(--r); }
.empty strong { display: block; color: var(--ink); font: 700 1.3rem/1.2 var(--font-display); text-transform: uppercase; margin-bottom: 6px; }

/* New list */
.stamp {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--r); background: var(--chip);
  font-variant-numeric: tabular-nums;
}

/* List detail */
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.total { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.total b { display: block; font: 700 1.7rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.total span { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .92rem; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-weight: 600; min-width: 0; }
.items { display: flex; flex-direction: column; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.item {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 2px 8px; text-align: left; width: 100%;
  padding: 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
}
.item:last-child { border-bottom: 0; }
.item .n { grid-row: span 4; font: 700 1.2rem/1.2 var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.item .line { font-family: var(--font-code); font-size: .85rem; word-break: break-all; }
.item .line i { font-style: normal; color: var(--muted); font-family: var(--font-body); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
.item .none { color: var(--warn); }
.item .det { font-size: .88rem; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.row.tight > * { flex-basis: 90px; }
.pick { display: flex; flex-direction: column; gap: 8px; }
.pick .btn { justify-content: flex-start; font-family: var(--font-code); font-weight: 500; word-break: break-all; text-align: left; min-height: 48px; padding-block: 8px; }

/* Scan */
.cam {
  position: relative; background: #000; overflow: hidden;
  height: 38vh; min-height: 220px; max-height: 360px;
}
#video { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Aiming frame: corner brackets plus a laser line; everything visible is scanned. */
.guide { position: absolute; inset: 14% 5%; pointer-events: none; z-index: 2;
  background:
    linear-gradient(#fff, #fff) top left / 28px 3px no-repeat, linear-gradient(#fff, #fff) top left / 3px 28px no-repeat,
    linear-gradient(#fff, #fff) top right / 28px 3px no-repeat, linear-gradient(#fff, #fff) top right / 3px 28px no-repeat,
    linear-gradient(#fff, #fff) bottom left / 28px 3px no-repeat, linear-gradient(#fff, #fff) bottom left / 3px 28px no-repeat,
    linear-gradient(#fff, #fff) bottom right / 28px 3px no-repeat, linear-gradient(#fff, #fff) bottom right / 3px 28px no-repeat; }
.guide::after { content: ""; position: absolute; left: 3%; right: 3%; top: 50%; height: 2px; background: #ff4d3d; box-shadow: 0 0 8px #ff4d3d; opacity: .85; }
.cam-tools { position: absolute; right: 12px; bottom: 12px; z-index: 5; display: flex; gap: 8px; }
.cam-msg {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; color: #e8edf2; background: #0f151c; font-size: .95rem;
}
.cam-tool {
  background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.4);
  border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .85rem;
}
.cam-tool[aria-pressed="true"] { background: #ffb81c; color: #16202b; }
.flash { position: absolute; inset: 0; pointer-events: none; border: 0 solid #3cbf74; transition: border-width .15s; z-index: 4; }
.flash.on { border-width: 10px; }

.steps { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); background: var(--surface); border-bottom: 1px solid var(--line); }
.steps span {
  padding: 10px 4px; text-align: center; font: 700 .95rem/1 var(--font-display); text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); border-bottom: 3px solid transparent;
}
.steps span.on { color: var(--ink); border-bottom-color: var(--accent); }
.steps span.done { color: var(--ok); }
.prompt { font: 700 1.9rem/1.05 var(--font-display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.captured {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
}
.captured > div { min-width: 0; }
.captured .val { font-family: var(--font-code); font-size: 1rem; word-break: break-all; }
.captured .val.none { color: var(--warn); font-family: var(--font-body); font-weight: 600; }
.captured button { flex: none; }
.warnbox { padding: 10px 12px; border-radius: var(--r); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--ink); border: 1px solid var(--warn); font-size: .92rem; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
.stepper button { min-height: 50px; border-radius: var(--r); border: 1px solid var(--line); background: var(--chip); font: 700 1.5rem/1 var(--font-display); }
.stepper input { text-align: center; font: 700 1.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.recent { font-size: .85rem; color: var(--muted); }

/* Toast + sheet */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  padding: 14px 16px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-weight: 600;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); transition: opacity .2s, transform .2s;
}
.toast.hide { opacity: 0; transform: translateY(10px); pointer-events: none; }
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(10,15,20,.5); display: flex; align-items: flex-end; }
.sheet {
  width: 100%; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0;
  padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h3 { margin: 0; font: 700 1.5rem/1 var(--font-display); text-transform: uppercase; }
@media (min-width: 640px) {
  .body, .sheet { max-width: 640px; margin-inline: auto; width: 100%; }
}
.export-opt { flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 10px 16px; text-align: left; }
.export-opt b { font: 700 1.25rem/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.export-opt span { font-size: .85rem; font-weight: 500; color: var(--muted); }
.export-opt[aria-busy="true"] { opacity: .6; }
.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kind {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
  min-height: 112px; padding: 14px; border-radius: var(--r); border: 0;
  background: var(--ink); color: var(--bg);
}
.kind b { font: 700 1.5rem/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; color: var(--accent); }
.kind span { font-size: .8rem; line-height: 1.35; opacity: .8; }
.kind:active { transform: translateY(1px); }
.kind-tag { font: 700 .7rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ciic-chips .chip { min-width: 48px; font-family: var(--font-code); }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- HOME -->
<section class="screen" id="s-home">
  <header class="topbar"><h1>Inventory Scan</h1></header>
  <div class="body">
    <div class="label">Start a new list</div>
    <div class="kinds" id="kinds">
      <button class="kind" data-kind="tally"><b>Tally Sheet</b><span>SCAC · TCN · Tracking · Package · Pieces · Weight</span></button>
      <button class="kind" data-kind="weekly"><b>Weekly Inventory</b><span>TCN · Tracking · NSN · Package · Pieces · CIIC · Location</span></button>
    </div>
    <div class="label">Lists on this phone</div>
    <div id="home-lists" class="stack"></div>
  </div>
</section>

<!-- NEW LIST -->
<section class="screen" id="s-new" hidden>
  <header class="topbar"><button id="new-back">Cancel</button><h2 id="new-title">New List</h2></header>
  <form class="body" id="new-form" novalidate>
    <div class="field">
      <label class="label" for="new-member">Member name</label>
      <input class="input" id="new-member" autocomplete="name" placeholder="Who is building this list?" required>
    </div>
    <div class="field" id="scac-field">
      <span class="label" id="scac-label">SCAC (carrier)</span>
      <div class="chips" id="scac-chips" role="group" aria-labelledby="scac-label"></div>
      <input class="input code" id="new-scac-other" placeholder="Type SCAC, e.g. ODFL" maxlength="4" autocapitalize="characters" hidden>
    </div>
    <div class="stamp"><span class="label">Created</span><span id="new-stamp"></span></div>
    <p class="hint" id="new-err" style="color:var(--danger)" hidden></p>
    <button class="btn primary block" type="submit">Start Scanning</button>
  </form>
</section>

<!-- LIST DETAIL -->
<section class="screen" id="s-list" hidden>
  <header class="topbar"><button id="list-back">Lists</button><h2 id="list-title"></h2></header>
  <div class="body">
    <dl class="meta" id="list-meta"></dl>
    <div class="totals" id="list-totals"></div>
    <button class="btn primary block" id="btn-scan">Scan Items</button>
    <div class="row">
      <button class="btn" id="btn-export">Export</button>
      <button class="btn danger" id="btn-del-list">Delete List</button>
    </div>
    <div class="label">Items</div>
    <div class="items" id="list-items"></div>
  </div>
</section>

<!-- SCAN -->
<section class="screen" id="s-scan" hidden>
  <header class="topbar">
    <button id="scan-done">Done</button>
    <h2 id="scan-title">Scanning</h2>
  </header>
  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="guide" aria-hidden="true"></div>
    <div class="flash" id="flash"></div>
    <div class="cam-msg" id="cam-msg">Starting camera…</div>
    <div class="cam-tools">
      <button class="cam-tool" id="zoom" hidden>1×</button>
      <button class="cam-tool" id="torch" aria-pressed="false" hidden>Light</button>
    </div>
  </div>
  <div class="steps" id="steps"></div>
  <div class="body" id="scan-body">

    <!-- step: TCN / tracking (shared scan panel) -->
    <div id="p-scan" class="field" style="gap:14px">
      <div class="field" id="cap-mini" style="gap:8px"></div>
      <p class="prompt" id="scan-prompt">Scan TCN</p>
      <p class="hint" id="scan-hint">Point the camera at the TCN barcode or QR code.</p>
      <div class="row tight">
        <button class="btn" id="btn-none"></button>
        <button class="btn" id="btn-type">Type it</button>
        <button class="btn" id="btn-photo">Photo</button>
      </div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
      <div class="pick" id="pick" hidden></div>
      <form class="row" id="type-form" hidden>
        <input class="input code" id="type-input" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn primary" type="submit" style="flex:0 0 auto">Use</button>
      </form>
      <p class="recent" id="recent"></p>
    </div>

    <!-- step: details -->
    <form id="p-det" class="field" style="gap:14px" hidden novalidate>
      <div class="field" id="cap-list" style="gap:8px"></div>
      <div class="warnbox" id="dup-warn" hidden></div>
      <div class="field">
        <span class="label" id="pkg-label">Package type</span>
        <div class="chips" id="pkg-chips" role="group" aria-labelledby="pkg-label"></div>
        <input class="input" id="pkg-other" placeholder="Describe package type" hidden>
      </div>
      <div class="two">
        <div class="field">
          <label class="label" for="pieces">Piece count</label>
          <div class="stepper">
            <button type="button" id="pc-minus" aria-label="Fewer pieces">−</button>
            <input class="input" id="pieces" inputmode="numeric" pattern="[0-9]*" value="1">
            <button type="button" id="pc-plus" aria-label="More pieces">+</button>
          </div>
        </div>
        <div class="field" id="weight-field">
          <label class="label" for="weight">Weight (lb)</label>
          <input class="input" id="weight" inputmode="decimal" placeholder="0.0">
        </div>
      </div>
      <div class="field" id="ciic-field">
        <span class="label" id="ciic-label">CIIC</span>
        <div class="chips ciic-chips" id="ciic-chips" role="group" aria-labelledby="ciic-label"></div>
        <input class="input code" id="ciic-other" placeholder="Type CIIC code" maxlength="1" autocapitalize="characters" hidden>
      </div>
      <div class="field" id="loc-field">
        <label class="label" for="location">Location</label>
        <input class="input code" id="location" placeholder="e.g. A-12-03" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <button class="btn primary block" type="submit">Save &amp; Scan Next</button>
    </form>
  </div>
</section>

<!-- EDIT ITEM SHEET -->
<div class="sheet-wrap" id="edit-wrap" hidden>
  <form class="sheet" id="edit-form" novalidate>
    <h3 id="edit-title">Edit Item</h3>
    <div class="field">
      <label class="label" for="e-tcn">TCN (leave blank for No TCN)</label>
      <input class="input code" id="e-tcn" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="field">
      <label class="label" for="e-trk">Tracking number (leave blank for none)</label>
      <input class="input code" id="e-trk" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="field" data-tally>
      <label class="label" for="e-nsn">NSN (leave blank for No NSN)</label>
      <input class="input code" id="e-nsn" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="field">
      <label class="label" for="e-pkg">Package type</label>
      <input class="input" id="e-pkg">
    </div>
    <div class="two">
      <div class="field"><label class="label" for="e-pcs">Piece count</label><input class="input" id="e-pcs" inputmode="numeric"></div>
      <div class="field" data-weekly><label class="label" for="e-wt">Weight (lb)</label><input class="input" id="e-wt" inputmode="decimal"></div>
      <div class="field" data-tally><label class="label" for="e-ciic">CIIC</label><input class="input code" id="e-ciic" maxlength="1" autocapitalize="characters"></div>
    </div>
    <div class="field" data-tally>
      <label class="label" for="e-loc">Location</label>
      <input class="input code" id="e-loc" autocapitalize="characters" spellcheck="false">
    </div>
    <button class="btn primary block" type="submit">Save Changes</button>
    <div class="row">
      <button class="btn" type="button" id="e-cancel">Cancel</button>
      <button class="btn danger" type="button" id="e-del">Delete Item</button>
    </div>
  </form>
</div>

<!-- EXPORT SHEET -->
<div class="sheet-wrap" id="export-wrap" hidden>
  <div class="sheet" role="dialog" aria-labelledby="export-title">
    <h3 id="export-title">Export List</h3>
    <p class="hint" id="export-sum"></p>
    <button class="btn export-opt" data-fmt="pdf"><b>PDF</b><span>Printable report with header and totals</span></button>
    <button class="btn export-opt" data-fmt="xlsx"><b>Excel</b><span>.xlsx spreadsheet, opens in Excel or Sheets</span></button>
    <button class="btn export-opt" data-fmt="csv"><b>CSV</b><span>Plain data file for uploading to other systems</span></button>
    <button class="btn" id="export-cancel">Cancel</button>
  </div>
</div>

<div class="toast hide" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/zxing/zxing-reader.js"></script>
<script>
(() => {
  'use strict';
  const COMMON_SCACS = ['FDE', 'UPSN', 'PAZC'];
  const PKG_TYPES = ['Box', 'Pallet', 'Envelope', 'Crate', 'Tube', 'Bag', 'Drum'];
  const CIIC_CODES = ['U', 'J', '7', '9', 'Q', 'R'];
  const KINDS = { tally: 'Tally Sheet', weekly: 'Weekly Inventory' };
  const isWeekly = l => l && l.kind === 'weekly';
  const tagOf = l => isWeekly(l) ? 'WEEKLY' : l.scac;
  const KEY = 'inventory-scan.v1';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- storage ----------
  let store = { lists: [], lastMember: '', lastPkg: 'Box', lastLocation: '' };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.lists)) store = Object.assign(store, s); } catch {}
  store.lists.forEach(l => { if (!l.kind) l.kind = 'tally'; });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };
  try { navigator.storage?.persist?.(); } catch {}

  // ---------- formatting ----------
  const fmtDate = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  const pad = n => String(n).padStart(2, '0');
  const csvDate = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const totals = l => ({
    items: l.items.length,
    pieces: l.items.reduce((a, i) => a + (+i.pieces || 0), 0),
    weight: l.items.reduce((a, i) => a + (parseFloat(i.weight) || 0), 0)
  });
  const fmtWt = w => (Math.round(w * 10) / 10).toLocaleString();

  // ---------- barcode clean-up ----------
  const cleanTcn = raw => raw.replace(/[\x00-\x1f]/g, '').trim().replace(/\s+/g, '').toUpperCase();
  function cleanTracking(raw) {
    let s = raw.replace(/[\x00-\x1f]/g, '').trim().replace(/\s+/g, '').toUpperCase();
    const ups = s.match(/1Z[0-9A-Z]{16}/);            // UPS: 1Z + 16
    if (ups) return ups[0];
    if (/^\d{34}$/.test(s)) return s.slice(-12);      // FedEx Express 34-digit label barcode
    const usps = s.match(/^420\d{5}(?:\d{4})?(9\d{19,25})$/); // USPS GS1 with ZIP prefix
    if (usps) return usps[1];
    return s;
  }

  // NSN: 13 characters (4-digit FSC + 9-character NIIN), shown as 5340-01-234-5678.
  function cleanNsn(raw) {
    const s = raw.replace(/[\x00-\x1f]/g, '').trim().replace(/\s+/g, '').toUpperCase();
    const d = s.replace(/-/g, '');
    return /^\d{4}[0-9A-Z]{9}$/.test(d) ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 9)}-${d.slice(9)}` : s;
  }

  // ---------- feedback ----------
  let actx;
  function beep(ok = true) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = ok ? 1760 : 330; g.gain.value = 0.08;
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? 0.08 : 0.25));
    } catch {}
    try { navigator.vibrate?.(ok ? 60 : [80, 60, 80]); } catch {}
    const f = $('#flash'); f.style.borderColor = ok ? '#3cbf74' : '#ef6a5f';
    f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 220);
  }
  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 2200);
  }
  // Two-tap confirm (no native dialogs): first tap arms the button, second tap within 3s runs it.
  function confirmTap(btn, label, fn) {
    if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; fn(); return; }
    btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
    setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3000);
  }

  // ---------- navigation ----------
  let current = null; // active list
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id);
    if (id !== 's-scan') { stopCamera(); releaseWake(); }
  }

  // ---------- home ----------
  function renderHome() {
    const el = $('#home-lists');
    const lists = [...store.lists].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    if (!lists.length) {
      el.innerHTML = `<div class="empty"><strong>No lists yet</strong>Choose <b>Tally Sheet</b> or <b>Weekly Inventory</b> above, enter your name, then start scanning.</div>`;
      return;
    }
    el.innerHTML = lists.map(l => {
      const t = totals(l);
      return `<button class="list-card" data-id="${l.id}">
        <span class="scac-tag">${esc(tagOf(l))}</span>
        <span class="who">${esc(l.member)}</span>
        <span class="count">${t.items}<small>items</small></span>
        <span class="when"><span class="kind-tag">${KINDS[l.kind]}</span> · ${esc(fmtDate(l.createdAt))}</span>
      </button>`;
    }).join('');
  }
  $('#home-lists').addEventListener('click', e => {
    const b = e.target.closest('.list-card'); if (!b) return;
    openList(store.lists.find(l => l.id === b.dataset.id));
  });

  // ---------- new list ----------
  let newScac = '', newKind = 'tally', stampTimer;
  function renderScacChips() {
    const isOther = newScac === 'OTHER';
    $('#scac-chips').innerHTML = [...COMMON_SCACS, 'Other'].map(s => {
      const v = s === 'Other' ? 'OTHER' : s;
      return `<button type="button" class="chip scac" data-v="${v}" aria-pressed="${newScac === v}">${s}</button>`;
    }).join('');
    $('#new-scac-other').hidden = !isOther;
  }
  $('#scac-chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    newScac = b.dataset.v; renderScacChips(); $('#new-err').hidden = true;
    if (newScac === 'OTHER') $('#new-scac-other').focus();
  });
  $('#kinds').addEventListener('click', e => {
    const k = e.target.closest('.kind'); if (!k) return;
    newKind = k.dataset.kind;
    $('#new-title').textContent = 'New ' + KINDS[newKind];
    $('#scac-field').hidden = newKind === 'weekly';
    newScac = ''; renderScacChips();
    $('#new-member').value = store.lastMember || '';
    $('#new-scac-other').value = '';
    $('#new-err').hidden = true;
    const tick = () => $('#new-stamp').textContent = fmtDate(new Date().toISOString());
    tick(); clearInterval(stampTimer); stampTimer = setInterval(tick, 15000);
    show('s-new');
    if (!store.lastMember) $('#new-member').focus();
  });
  $('#new-back').addEventListener('click', () => { clearInterval(stampTimer); show('s-home'); });
  $('#new-form').addEventListener('submit', e => {
    e.preventDefault();
    const member = $('#new-member').value.trim();
    const scac = newKind === 'weekly' ? '' : newScac === 'OTHER' ? $('#new-scac-other').value.trim().toUpperCase() : newScac;
    const err = !member ? 'Enter the member name.' : (!scac && newKind !== 'weekly') ? 'Choose a SCAC, or tap Other and type one.' : '';
    if (err) { $('#new-err').textContent = err; $('#new-err').hidden = false; return; }
    clearInterval(stampTimer);
    const list = { id: uid(), kind: newKind, member, scac, createdAt: new Date().toISOString(), items: [] };
    store.lists.push(list); store.lastMember = member; save();
    current = list;
    startScan();
  });

  // ---------- list detail ----------
  function openList(l) { current = l; renderList(); show('s-list'); }
  function renderList() {
    const l = current, t = totals(l);
    $('#list-title').textContent = `${tagOf(l)} · ${l.items.length} items`;
    $('#list-meta').innerHTML = `<dt>Type</dt><dd>${KINDS[l.kind]}</dd><dt>Member</dt><dd>${esc(l.member)}</dd>${isWeekly(l) ? '' : `<dt>SCAC</dt><dd class="code">${esc(l.scac)}</dd>`}<dt>Created</dt><dd>${esc(fmtDate(l.createdAt))}</dd>`;
    $('#list-totals').innerHTML = `
      <div class="total"><b>${t.items}</b><span>Items</span></div>
      <div class="total"><b>${t.pieces}</b><span>Pieces</span></div>
      ${isWeekly(l)
        ? `<div class="total"><b>${new Set(l.items.map(i => i.location).filter(Boolean)).size}</b><span>Locations</span></div>`
        : `<div class="total"><b>${fmtWt(t.weight)}</b><span>Total lb</span></div>`}`;
    $('#list-items').innerHTML = l.items.length ? l.items.map((it, i) => `
      <button class="item" data-i="${i}">
        <span class="n">${i + 1}</span>
        <span class="line"><i>TCN</i>${it.tcn ? esc(it.tcn) : '<span class="none">No TCN</span>'}</span>
        <span class="line"><i>Trk</i>${it.tracking ? esc(it.tracking) : '<span class="none">No tracking #</span>'}</span>
        ${isWeekly(l) ? `<span class="line"><i>NSN</i>${it.nsn ? esc(it.nsn) : '<span class="none">No NSN</span>'}</span>` : ''}
        <span class="det">${esc(it.pkgType)} · ${it.pieces} pc${it.pieces == 1 ? '' : 's'}${isWeekly(l)
          ? (it.ciic ? ' · CIIC ' + esc(it.ciic) : '') + (it.location ? ' · ' + esc(it.location) : '')
          : (it.weight ? ' · ' + esc(it.weight) + ' lb' : '')}</span>
      </button>`).join('') : `<div class="empty" style="border:0"><strong>No items</strong>Tap Scan Items to add the first one.</div>`;
  }
  $('#list-back').addEventListener('click', () => { renderHome(); show('s-home'); });
  $('#btn-scan').addEventListener('click', () => startScan());
  $('#btn-del-list').addEventListener('click', e => confirmTap(e.currentTarget, 'Tap again to delete', () => {
    store.lists = store.lists.filter(l => l !== current); save();
    toast('List deleted'); renderHome(); show('s-home');
  }));
  $('#list-items').addEventListener('click', e => {
    const b = e.target.closest('.item'); if (b) openEdit(+b.dataset.i);
  });

  // ---------- export (PDF / Excel / CSV) ----------
  // Column sets per list type. w = Excel width, pdf = fixed PDF width (others share the rest).
  const COLS = {
    tally: [
      { h: 'Item #', w: 14, pdf: 44, v: (it, i) => i + 1 },
      { h: 'TCN', w: 27, code: true, v: it => it.tcn || 'NO TCN' },
      { h: 'Tracking Number', w: 28, code: true, v: it => it.tracking || 'NO TRACKING NUMBER' },
      { h: 'Package Type', w: 16, pdf: 74, v: it => it.pkgType },
      { h: 'Piece Count', w: 13, pdf: 70, pieces: true, v: it => +it.pieces || 1 },
      { h: 'Weight (lb)', w: 13, pdf: 70, weight: true, v: it => it.weight === '' || it.weight == null ? null : (parseFloat(it.weight) || 0) }
    ],
    weekly: [
      { h: 'Item #', w: 10, pdf: 40, v: (it, i) => i + 1 },
      { h: 'TCN', w: 25, code: true, v: it => it.tcn || 'NO TCN' },
      { h: 'Tracking Number', w: 25, code: true, v: it => it.tracking || 'NO TRACKING NUMBER' },
      { h: 'NSN', w: 20, pdf: 112, code: true, v: it => it.nsn || 'NO NSN' },
      { h: 'Package Type', w: 15, pdf: 72, v: it => it.pkgType },
      { h: 'Piece Count', w: 12, pdf: 60, pieces: true, v: it => +it.pieces || 1 },
      { h: 'CIIC', w: 8, pdf: 40, v: it => it.ciic || '' },
      { h: 'Location', w: 16, pdf: 84, v: it => it.location || '' }
    ]
  };
  const cols = l => COLS[l.kind] || COLS.tally;
  const isMissing = v => typeof v === 'string' && /^NO (TCN|TRACKING|NSN)/.test(v);

  // Load a vendored library the first time it's needed, so the app starts fast.
  const loaded = {};
  const loadScript = src => loaded[src] || (loaded[src] = new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.onload = res;
    el.onerror = () => { delete loaded[src]; rej(new Error('load failed: ' + src)); };
    document.head.appendChild(el);
  }));

  function toCsv(l) {
    const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const cs = cols(l);
    const scac = !isWeekly(l);
    const head = ['List Type', 'List Created', 'Member', ...(scac ? ['SCAC'] : []), ...cs.map(c => c.h), 'Scanned At'];
    const rows = l.items.map((it, i) => [KINDS[l.kind], csvDate(l.createdAt), l.member, ...(scac ? [l.scac] : []), ...cs.map(c => c.v(it, i)), csvDate(it.scannedAt)]);
    return [head, ...rows].map(r => r.map(q).join(',')).join('\r\n') + '\r\n';
  }

  // Shared report pieces: title like FDE13OCT2026, date 13-Oct-26, time 22:45.
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const listTitle = l => { const d = new Date(l.createdAt); return `${isWeekly(l) ? 'INV' : l.scac}${pad(d.getDate())}${MON[d.getMonth()].toUpperCase()}${d.getFullYear()}`; };
  const fileName = l => listTitle(l);
  const repDate = iso => { const d = new Date(iso); return `${pad(d.getDate())}-${MON[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`; };
  const repTime = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  async function toXlsx(l) {
    await loadScript('vendor/exceljs.min.js');
    const title = listTitle(l), n = l.items.length, t = totals(l);
    const cs = cols(l), nc = cs.length, L = c => String.fromCharCode(64 + c), END = L(nc);
    const C = { navy: 'FF16202B', amber: 'FFFFB81C', slate: 'FF34465A', label: 'FFE9EDF1', band: 'FFF5F7FA',
      line: 'FFC9D1DA', muted: 'FF5B6878', warn: 'FFB85C00', white: 'FFFFFFFF' };
    const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
    const thin = { style: 'thin', color: { argb: C.line } };
    const box = { top: thin, left: thin, bottom: thin, right: thin };
    // Excel stores wall-clock time with no zone; ExcelJS reads Dates as UTC, so pass local parts as UTC.
    const d = new Date(l.createdAt);
    const xlDate = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()));

    const wb = new ExcelJS.Workbook();
    wb.creator = l.member; wb.created = new Date();
    const ws = wb.addWorksheet(title, {
      views: [{ state: 'frozen', ySplit: 7, showGridLines: false }],
      pageSetup: { paperSize: 1, orientation: isWeekly(l) ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
        horizontalCentered: true, printTitlesRow: '7:7',
        margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.6, header: 0.3, footer: 0.3 } },
      headerFooter: { oddFooter: `&L&8${title} · ${KINDS[l.kind]} · ${l.member}&R&8Page &P of &N` }
    });
    ws.columns = cs.map(c => ({ width: c.w }));

    // Title bar (name + list type) and amber rule
    ws.mergeCells(`A1:${END}1`);
    const tc = ws.getCell('A1');
    tc.value = { richText: [
      { text: title, font: { name: 'Calibri', size: 24, bold: true, color: { argb: C.white } } },
      { text: '\n' + KINDS[l.kind].toUpperCase(), font: { name: 'Calibri', size: 10, bold: true, color: { argb: C.amber } } }
    ] };
    tc.fill = fill(C.navy);
    tc.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    ws.getRow(1).height = 54;
    ws.mergeCells(`A2:${END}2`); ws.getCell('A2').fill = fill(C.amber); ws.getRow(2).height = 5;
    ws.getRow(3).height = 10; ws.getRow(6).height = 10;

    // Label/value pairs. valueEnd lets a value span two columns.
    const pair = (labelRef, valueRef, valueEnd, label, value, numFmt) => {
      if (valueEnd) ws.mergeCells(`${valueRef}:${valueEnd}`);
      const lc = ws.getCell(labelRef);
      lc.value = label; lc.fill = fill(C.label); lc.border = box;
      lc.font = { bold: true, size: 10, color: { argb: C.muted } };
      lc.alignment = { vertical: 'middle', indent: 1 };
      [valueRef, valueEnd].filter(Boolean).forEach(r => { ws.getCell(r).border = box; });
      const vc = ws.getCell(valueRef);
      vc.value = value;
      vc.font = { bold: true, size: 11, color: { argb: C.navy } };
      vc.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
      if (numFmt) vc.numFmt = numFmt;
    };
    const RL = L(nc - 2), RV = L(nc - 1); // right-hand label / value columns
    pair('A4', 'B4', null, 'Member', l.member);
    if (!isWeekly(l)) pair('A5', 'B5', null, 'SCAC', l.scac);
    pair(`${RL}4`, `${RV}4`, `${END}4`, 'Date', xlDate, 'dd-mmm-yy');
    pair(`${RL}5`, `${RV}5`, `${END}5`, 'Time', xlDate, 'hh:mm');
    ws.getRow(4).height = 20; ws.getRow(5).height = 20;

    // Item table
    const hdr = ws.getRow(7);
    hdr.values = cs.map(c => c.h); hdr.height = 24;
    hdr.eachCell(c => {
      c.font = { bold: true, size: 11, color: { argb: C.white } };
      c.fill = fill(C.slate); c.border = box;
      c.alignment = { horizontal: 'center', vertical: 'middle' };
    });
    l.items.forEach((it, i) => {
      const r = ws.getRow(8 + i);
      r.values = cs.map(c => c.v(it, i)); r.height = 19;
      cs.forEach((col, k) => {
        const cell = r.getCell(k + 1);
        cell.border = box;
        cell.alignment = col.code ? { horizontal: 'left', vertical: 'middle', indent: 1 } : { horizontal: 'center', vertical: 'middle' };
        if (i % 2) cell.fill = fill(C.band);
        if (col.code) {
          cell.font = isMissing(cell.value) ? { italic: true, size: 10, color: { argb: C.warn } } : { name: 'Consolas', size: 10.5, color: { argb: C.navy } };
        }
        if (col.weight) cell.numFmt = '#,##0.0';
      });
    });
    const last = 7 + n;
    ws.autoFilter = `A7:${END}${Math.max(8, last)}`;

    // Totals (live formulas, so edits in Excel re-total)
    const tr = last + 2;
    const colOf = key => L(cs.findIndex(c => c[key]) + 1);
    const sum = (col, result) => n ? { formula: `SUM(${col}8:${col}${last})`, result } : result;
    pair(`A${tr}`, `B${tr}`, null, 'Total pieces', sum(colOf('pieces'), t.pieces));
    pair(`A${tr + 1}`, `B${tr + 1}`, null, 'Total items', n ? { formula: `COUNTA(A8:A${last})`, result: n } : 0);
    if (cs.some(c => c.weight)) {
      pair(`${RL}${tr}`, `${RV}${tr}`, `${END}${tr}`, 'Total weight', sum(colOf('weight'), Math.round(t.weight * 10) / 10), '#,##0.0 "lb"');
      ws.getCell(`${RV}${tr}`).alignment = { horizontal: 'center', vertical: 'middle' };
    }
    [tr, tr + 1].forEach(r => { ws.getRow(r).height = 20; ws.getCell(`B${r}`).alignment = { horizontal: 'center', vertical: 'middle' }; });

    const buf = await wb.xlsx.writeBuffer();
    return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  async function toPdf(l) {
    await loadScript('vendor/jspdf.umd.min.js');
    await loadScript('vendor/jspdf.plugin.autotable.min.js');
    const { jsPDF } = window.jspdf;
    if (!jsPDF.API.autoTable && window.applyPlugin) window.applyPlugin(jsPDF);
    const doc = new jsPDF({ unit: 'pt', format: 'letter', orientation: isWeekly(l) ? 'landscape' : 'portrait' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
    const title = listTitle(l), t = totals(l), cs = cols(l);
    const NAVY = [22, 32, 43], SLATE = [52, 70, 90], MUTED = [91, 104, 120], LINE = [201, 209, 218], LABEL = [233, 237, 241];

    // Title bar (name + list type) and amber rule
    doc.setFillColor(...NAVY); doc.rect(0, 0, W, 66, 'F');
    doc.setFillColor(255, 184, 28); doc.rect(0, 66, W, 4, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(26); doc.setTextColor(255, 255, 255);
    doc.text(title, W / 2, 38, { align: 'center' });
    doc.setFontSize(9); doc.setTextColor(255, 184, 28);
    doc.text(KINDS[l.kind].toUpperCase(), W / 2, 55, { align: 'center', charSpace: 1.2 });

    // Label/value box pair, shrinking long values to fit.
    const LW = 78, VW = 160, BH = 22;
    const pair = (x, y, label, value) => {
      doc.setDrawColor(...LINE); doc.setLineWidth(0.75);
      doc.setFillColor(...LABEL); doc.rect(x, y, LW, BH, 'FD');
      doc.rect(x + LW, y, VW, BH, 'S');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...MUTED);
      doc.text(label, x + 8, y + 14.5);
      let fs = 11; doc.setFontSize(fs);
      while (fs > 7 && doc.getTextWidth(value) > VW - 16) doc.setFontSize(--fs);
      doc.setTextColor(...NAVY); doc.text(value, x + LW + 8, y + 14.5);
    };
    const RX = W - M - LW - VW;
    pair(M, 92, 'Member', l.member);
    if (!isWeekly(l)) pair(M, 92 + BH, 'SCAC', l.scac);
    pair(RX, 92, 'Date', repDate(l.createdAt));
    pair(RX, 92 + BH, 'Time', repTime(l.createdAt));

    const columnStyles = {};
    cs.forEach((c, i) => {
      columnStyles[i] = c.code ? { font: 'courier', fontStyle: 'bold' } : { halign: 'center' };
      if (c.pdf) columnStyles[i].cellWidth = c.pdf;
    });
    doc.autoTable({
      startY: 92 + BH * 2 + 24,
      margin: { left: M, right: M, bottom: 48, top: 40 },
      head: [cs.map(c => c.h)],
      body: l.items.length
        ? l.items.map((it, i) => cs.map(c => { const v = c.v(it, i); return v == null ? '' : c.weight ? v.toFixed(1) : String(v); }))
        : [[{ content: 'No items scanned', colSpan: cs.length, styles: { halign: 'center', textColor: MUTED, fontStyle: 'italic' } }]],
      theme: 'grid',
      styles: { fontSize: 9.5, cellPadding: { top: 6, bottom: 6, left: 6, right: 6 }, lineColor: LINE, lineWidth: 0.75, textColor: NAVY, valign: 'middle' },
      headStyles: { fillColor: SLATE, textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center' },
      alternateRowStyles: { fillColor: [245, 247, 250] },
      columnStyles,
      didParseCell: c => {
        if (c.section === 'body' && isMissing(c.cell.raw)) {
          c.cell.styles.textColor = [184, 92, 0]; c.cell.styles.font = 'helvetica'; c.cell.styles.fontStyle = 'italic';
        }
      }
    });

    // Totals block under the table (new page if it won't fit)
    let y = doc.lastAutoTable.finalY + 22;
    if (y + BH * 2 > H - 60) { doc.addPage(); y = 50; }
    pair(M, y, 'Total pieces', String(t.pieces));
    pair(M, y + BH, 'Total items', String(t.items));
    if (cs.some(c => c.weight)) pair(RX, y, 'Total weight', `${fmtWt(t.weight)} lb`);

    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setDrawColor(...LINE); doc.setLineWidth(0.5); doc.line(M, H - 34, W - M, H - 34);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
      doc.text(`${title} · ${KINDS[l.kind]} · ${l.member}`, M, H - 22);
      doc.text(`Page ${p} of ${pages}`, W - M, H - 22, { align: 'right' });
    }
    return doc.output('blob');
  }

  async function deliver(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(`Downloaded ${name}`);
  }

  const closeExport = () => { $('#export-wrap').hidden = true; };
  $('#btn-export').addEventListener('click', () => {
    const t = totals(current);
    $('#export-sum').textContent = `${KINDS[current.kind]} · ${isWeekly(current) ? '' : current.scac + ' · '}${current.member} · ${t.items} items, ${t.pieces} pieces` + (isWeekly(current) ? '' : `, ${fmtWt(t.weight)} lb`);
    $('#export-wrap').hidden = false;
  });
  $('#export-cancel').addEventListener('click', closeExport);
  $('#export-wrap').addEventListener('click', e => { if (e.target.id === 'export-wrap') closeExport(); });
  $('#export-wrap').addEventListener('click', async e => {
    const b = e.target.closest('.export-opt'); if (!b || b.getAttribute('aria-busy') === 'true') return;
    const fmt = b.dataset.fmt, l = current;
    b.setAttribute('aria-busy', 'true');
    try {
      const blob = fmt === 'pdf' ? await toPdf(l)
        : fmt === 'xlsx' ? await toXlsx(l)
        : new Blob([toCsv(l)], { type: 'text/csv' });
      closeExport();
      await deliver(blob, `${fileName(l)}.${fmt}`);
    } catch (err) {
      toast('Export failed. Check your connection and try again.');
    } finally {
      b.removeAttribute('aria-busy');
    }
  });

  // ---------- edit item ----------
  let editIdx = -1;
  function openEdit(i) {
    editIdx = i; const it = current.items[i];
    $('#edit-title').textContent = `Edit Item ${i + 1}`;
    $('#e-tcn').value = it.tcn; $('#e-trk').value = it.tracking; $('#e-pkg').value = it.pkgType;
    $('#e-pcs').value = it.pieces; $('#e-wt').value = it.weight ?? '';
    $('#e-nsn').value = it.nsn || ''; $('#e-ciic').value = it.ciic || ''; $('#e-loc').value = it.location || '';
    const tally = isWeekly(current);
    document.querySelectorAll('#edit-form [data-tally]').forEach(el => el.hidden = !tally);
    document.querySelectorAll('#edit-form [data-weekly]').forEach(el => el.hidden = tally);
    $('#edit-wrap').hidden = false;
  }
  const closeEdit = () => { $('#edit-wrap').hidden = true; editIdx = -1; };
  $('#e-cancel').addEventListener('click', closeEdit);
  $('#edit-wrap').addEventListener('click', e => { if (e.target.id === 'edit-wrap') closeEdit(); });
  $('#edit-form').addEventListener('submit', e => {
    e.preventDefault();
    const it = current.items[editIdx];
    it.tcn = cleanTcn($('#e-tcn').value);
    it.tracking = cleanTracking($('#e-trk').value);
    it.pkgType = $('#e-pkg').value.trim() || 'Box';
    it.pieces = Math.max(1, parseInt($('#e-pcs').value, 10) || 1);
    if (isWeekly(current)) {
      it.nsn = cleanNsn($('#e-nsn').value);
      it.ciic = $('#e-ciic').value.trim().toUpperCase();
      it.location = $('#e-loc').value.trim().toUpperCase();
    } else {
      it.weight = $('#e-wt').value.trim();
    }
    save(); closeEdit(); renderList(); toast('Item updated');
  });
  $('#e-del').addEventListener('click', e => confirmTap(e.currentTarget, 'Tap again to delete', () => {
    current.items.splice(editIdx, 1); save(); closeEdit(); renderList(); toast('Item deleted');
  }));

  // ---------- scanning flow ----------
  const SCAN = {
    tcn: { label: 'TCN', name: 'TCN', prompt: 'Scan TCN', none: 'No TCN', ph: 'Type TCN', clean: cleanTcn,
      hint: 'Point the camera at the TCN barcode or QR code. TCNs are 17 characters.' },
    trk: { label: 'Tracking', name: 'Tracking number', prompt: 'Scan Tracking #', none: 'No Tracking #', ph: 'Type tracking number', clean: cleanTracking,
      hint: 'Point the camera at the carrier tracking barcode.' },
    nsn: { label: 'NSN', name: 'NSN', prompt: 'Scan NSN', none: 'No NSN', ph: 'Type NSN', clean: cleanNsn,
      hint: 'Point the camera at the NSN barcode. NSNs are 13 digits, like 5340-01-234-5678.' }
  };
  let step = 'tcn', stepAt = 0, draft = null;
  const flow = () => isWeekly(current) ? ['tcn', 'trk', 'nsn', 'det'] : ['tcn', 'trk', 'det'];
  const newDraft = () => ({ tcn: '', trk: '', nsn: '', back: false, pkg: store.lastPkg || 'Box', pieces: 1, weight: '',
    ciic: '', location: store.lastLocation || '' });

  function startScan() {
    draft = newDraft();
    show('s-scan');
    setStep('tcn');
    requestWake();
  }
  $('#scan-done').addEventListener('click', () => { renderList(); show('s-list'); });

  // Captured-code rows with a redo button, e.g. "TCN  FB55...  [Rescan]".
  const capturedHtml = (keys, btn) => keys.map(k => {
    const v = draft[k];
    return `<div class="captured"><div><div class="label">${SCAN[k].name}</div>
      <div class="val${v ? '' : ' none'}">${v ? esc(v) : SCAN[k].none}</div></div>
      <button class="btn small" type="button" data-redo="${k}">${btn}</button></div>`;
  }).join('');

  function setStep(s) {
    step = s; stepAt = Date.now();
    const order = flow(), cur = order.indexOf(s);
    const steps = $('#steps');
    steps.style.setProperty('--n', order.length);
    steps.innerHTML = order.map((k, i) =>
      `<span class="${i === cur ? 'on' : i < cur ? 'done' : ''}">${i + 1} · ${k === 'det' ? 'Details' : SCAN[k].label}</span>`).join('');
    $('#scan-title').textContent = `${tagOf(current)} · Item ${current.items.length + 1}`;
    const scanning = s !== 'det';
    $('#p-scan').hidden = !scanning;
    $('#p-det').hidden = scanning;
    $('#cam').hidden = !scanning;
    $('#type-form').hidden = true;
    $('#pick').hidden = true;
    $('#scan-body').scrollTop = 0;
    if (scanning) {
      const c = SCAN[s];
      $('#scan-prompt').textContent = c.prompt;
      $('#scan-hint').textContent = c.hint;
      $('#btn-none').textContent = c.none;
      $('#type-input').placeholder = c.ph;
      $('#cap-mini').innerHTML = draft.back ? '' : capturedHtml(order.slice(0, cur), 'Redo');
      renderRecent();
      startCamera();
    } else {
      pauseCamera();
      renderDetails();
    }
  }

  function renderRecent() {
    const last = current.items.slice(-2).reverse();
    $('#recent').innerHTML = last.length
      ? 'Last saved: ' + last.map((it, k) => `#${current.items.length - k} ${esc(it.tcn || it.tracking || it.nsn || 'no codes')}`).join(' · ')
      : '';
  }

  function accept(value, fromCamera) {
    if (step === 'det') return;
    draft[step] = value ? SCAN[step].clean(value) : '';
    if (fromCamera) beep();
    const order = flow();
    const next = draft.back ? 'det' : order[order.indexOf(step) + 1];
    draft.back = false;
    setStep(next);
  }

  let lastCode = '', lastAt = 0;
  function onDecode(text) {
    const now = Date.now();
    if (step === 'det' || now - stepAt < 700) return;
    if (text === lastCode && now - lastAt < 2500) return;
    lastCode = text; lastAt = now;
    // Reject a code already captured for a different field on this item.
    const other = Object.keys(SCAN).find(k => k !== step && draft[k] && SCAN[step].clean(text) === draft[k]);
    if (other) { beep(false); toast(`That is the ${SCAN[other].name}. Scan the ${SCAN[step].name}.`); return; }
    accept(text, true);
  }

  $('#btn-none').addEventListener('click', () => accept('', false));
  $('#btn-type').addEventListener('click', () => {
    $('#type-form').hidden = false; $('#type-input').value = ''; $('#type-input').focus();
  });
  $('#type-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#type-input').value.trim(); if (!v) return;
    $('#type-input').blur(); accept(v, false);
  });
  $('#cap-mini').addEventListener('click', e => {
    const b = e.target.closest('[data-redo]'); if (b) setStep(b.dataset.redo);
  });
  $('#cap-list').addEventListener('click', e => {
    const b = e.target.closest('[data-redo]'); if (b) { draft.back = true; setStep(b.dataset.redo); }
  });

  // details
  function renderDetails() {
    const tally = isWeekly(current);
    $('#cap-list').innerHTML = capturedHtml(flow().filter(k => k !== 'det'), 'Rescan');
    // duplicate + format checks
    const notes = [];
    current.items.forEach((it, i) => {
      if (draft.tcn && it.tcn === draft.tcn) notes.push(`TCN already on item ${i + 1}.`);
      if (draft.trk && it.tracking === draft.trk) notes.push(`Tracking number already on item ${i + 1}.`);
    });
    if (draft.tcn && draft.tcn.length !== 17) notes.push(`TCN is ${draft.tcn.length} characters; most TCNs are 17. Check the scan.`);
    const nsnLen = draft.nsn.replace(/-/g, '').length;
    if (tally && draft.nsn && nsnLen !== 13) notes.push(`NSN is ${nsnLen} characters; NSNs are 13. Check the scan.`);
    $('#dup-warn').hidden = !notes.length; $('#dup-warn').textContent = notes.join(' ');
    $('#weight-field').hidden = tally;
    $('#ciic-field').hidden = !tally;
    $('#loc-field').hidden = !tally;
    renderPkgChips();
    renderCiicChips();
    $('#pieces').value = draft.pieces;
    $('#weight').value = draft.weight;
    $('#location').value = draft.location;
  }
  function renderPkgChips() {
    const isOther = !PKG_TYPES.includes(draft.pkg);
    $('#pkg-chips').innerHTML = [...PKG_TYPES, 'Other'].map(p => {
      const on = p === 'Other' ? isOther : draft.pkg === p;
      return `<button type="button" class="chip" data-v="${p}" aria-pressed="${on}">${p}</button>`;
    }).join('');
    $('#pkg-other').hidden = !isOther;
    if (isOther) $('#pkg-other').value = draft.pkg === 'Other' ? '' : draft.pkg;
  }
  $('#pkg-chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    draft.pkg = b.dataset.v; renderPkgChips();
    if (b.dataset.v === 'Other') $('#pkg-other').focus();
  });
  $('#pkg-other').addEventListener('input', e => { draft.pkg = e.target.value.trim() || 'Other'; });

  // CIIC: tap a common code (tap again to clear), or Other to type one.
  function renderCiicChips() {
    const isOther = draft.ciic === 'OTHER' || (draft.ciic && !CIIC_CODES.includes(draft.ciic));
    $('#ciic-chips').innerHTML = [...CIIC_CODES, 'Other'].map(c => {
      const on = c === 'Other' ? isOther : draft.ciic === c;
      return `<button type="button" class="chip" data-v="${c}" aria-pressed="${on}">${c}</button>`;
    }).join('');
    $('#ciic-other').hidden = !isOther;
    if (isOther) $('#ciic-other').value = draft.ciic === 'OTHER' ? '' : draft.ciic;
  }
  $('#ciic-chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const v = b.dataset.v;
    draft.ciic = v === 'Other' ? 'OTHER' : draft.ciic === v ? '' : v;
    renderCiicChips();
    if (v === 'Other') $('#ciic-other').focus();
  });
  $('#ciic-other').addEventListener('input', e => { draft.ciic = e.target.value.trim().toUpperCase() || 'OTHER'; });
  $('#location').addEventListener('input', e => { draft.location = e.target.value; });

  const setPieces = n => { draft.pieces = Math.max(1, n || 1); $('#pieces').value = draft.pieces; };
  $('#pc-minus').addEventListener('click', () => setPieces(draft.pieces - 1));
  $('#pc-plus').addEventListener('click', () => setPieces(draft.pieces + 1));
  $('#pieces').addEventListener('change', e => setPieces(parseInt(e.target.value, 10)));
  $('#weight').addEventListener('input', e => { draft.weight = e.target.value.replace(/[^0-9.]/g, ''); });

  $('#p-det').addEventListener('submit', e => {
    e.preventDefault();
    document.activeElement?.blur();
    setPieces(parseInt($('#pieces').value, 10));
    const pkgType = draft.pkg === 'Other' ? 'Other' : draft.pkg;
    const item = { id: uid(), tcn: draft.tcn, tracking: draft.trk, pkgType, pieces: draft.pieces, scannedAt: new Date().toISOString() };
    if (isWeekly(current)) {
      item.nsn = draft.nsn;
      item.ciic = draft.ciic === 'OTHER' ? '' : draft.ciic;
      item.location = $('#location').value.trim().toUpperCase();
      store.lastLocation = item.location;
    } else {
      item.weight = $('#weight').value.replace(/[^0-9.]/g, '');
    }
    current.items.push(item);
    store.lastPkg = pkgType; save();
    toast(`Item ${current.items.length} saved`);
    draft = newDraft();
    setStep('tcn');
  });

  // ---------- camera + decoder ----------
  // zxing-cpp (WebAssembly) reads long 1D codes far better than the older JS decoders.
  const ZX = window.ZXingWASM;
  if (ZX) {
    try {
      Promise.resolve(ZX.prepareZXingModule({
        overrides: { locateFile: (path, prefix) => path.endsWith('.wasm') ? new URL('vendor/zxing/' + path, location.href).href : prefix + path },
        fireImmediately: true
      })).catch(() => {});
    } catch {}
  }
  const READER = {
    formats: ['Code128', 'Code39', 'Code93', 'Codabar', 'ITF', 'EANUPC', 'DataBar', 'PDF417', 'QRCode', 'DataMatrix', 'Aztec', 'MaxiCode'],
    tryHarder: true, tryRotate: true, tryInvert: false, tryDownscale: true, maxNumberOfSymbols: 8
  };
  // What a good read looks like for each step, used to pick the right code off a busy label.
  const LOOKS = {
    tcn: t => /^[A-Z0-9]{17}$/.test(cleanTcn(t)),
    trk: t => /^(1Z[0-9A-Z]{16}|\d{12,22}|9\d{19,25})$/.test(cleanTracking(t)),
    nsn: t => /^\d{4}-\d{2}-\d{3}-[0-9A-Z]{4}$/.test(cleanNsn(t))
  };
  const NO_CHECKSUM = /^(Code39|Codabar|ITF)/; // formats that can misread: require two matching reads

  const video = $('#video');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let stream = null, track = null, camState = 'off', looping = false, pending = '';
  let torchOn = false, zoomSteps = [], zoomIdx = 0;
  const camMsg = m => { const el = $('#cam-msg'); el.hidden = !m; el.textContent = m || ''; };

  function pickBest(results, w, h) {
    const valid = results.filter(r => r.isValid && r.text);
    if (!valid.length) return null;
    const fits = valid.filter(r => LOOKS[step]?.(r.text));
    const pool = fits.length ? fits : valid;
    const dist = r => {
      const p = r.position;
      const x = (p.topLeft.x + p.topRight.x + p.bottomLeft.x + p.bottomRight.x) / 4;
      const y = (p.topLeft.y + p.topRight.y + p.bottomLeft.y + p.bottomRight.y) / 4;
      return Math.hypot(x - w / 2, y - h / 2);
    };
    return pool.sort((a, b) => dist(a) - dist(b))[0];
  }

  // Part of the camera frame actually visible in the (object-fit: cover) preview.
  function visibleRegion() {
    const vw = video.videoWidth, vh = video.videoHeight, cw = video.clientWidth, ch = video.clientHeight;
    if (!cw || !ch) return { x: 0, y: 0, w: vw, h: vh };
    const k = Math.max(cw / vw, ch / vh);
    const w = Math.min(vw, cw / k), h = Math.min(vh, ch / k);
    return { x: (vw - w) / 2, y: (vh - h) / 2, w, h };
  }

  async function scanLoop() {
    if (looping) return;
    looping = true;
    while (camState === 'running') {
      if (video.readyState >= 2 && video.videoWidth) {
        const r = visibleRegion();
        const k = Math.min(1, 1600 / Math.max(r.w, r.h));
        canvas.width = Math.round(r.w * k); canvas.height = Math.round(r.h * k);
        ctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, canvas.width, canvas.height);
        try {
          const res = await ZX.readBarcodes(ctx.getImageData(0, 0, canvas.width, canvas.height), READER);
          if (camState === 'running' && step !== 'det') {
            const best = pickBest(res, canvas.width, canvas.height);
            if (!best) pending = '';
            else if (NO_CHECKSUM.test(best.format) && pending !== best.text) pending = best.text;
            else { pending = ''; onDecode(best.text); }
          }
        } catch {}
      }
      await new Promise(r => setTimeout(r, 30));
    }
    looping = false;
  }

  async function startCamera() {
    if (camState === 'running' || camState === 'starting') return;
    if (camState === 'paused' && track && track.readyState === 'live') {
      camState = 'running'; video.play().catch(() => {}); scanLoop(); return;
    }
    if (!ZX) { camMsg('Scanner did not load. Use "Type it" to enter codes.'); return; }
    if (!navigator.mediaDevices?.getUserMedia) {
      camMsg('Camera needs a secure (https) address. Open the app from its https link, or use "Type it".'); return;
    }
    camState = 'starting'; camMsg('Starting camera…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      track = stream.getVideoTracks()[0];
      try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
      // iOS can end the stream when the photo camera opens; restart when we come back.
      track.addEventListener('ended', () => {
        stopCamera();
        if (!$('#s-scan').hidden && step !== 'det') startCamera();
      });
      video.srcObject = stream;
      await video.play();
      if ($('#s-scan').hidden) { stopCamera(); return; }
      camState = 'running'; camMsg('');
      setupTools();
      if (step === 'det') pauseCamera(); else scanLoop();
    } catch (err) {
      stopCamera();
      camMsg(!window.isSecureContext
        ? 'Camera needs a secure (https) address. Open the app from its https link, or use "Type it".'
        : 'Camera unavailable. Allow camera access for this site in your browser settings, or use "Type it".');
    }
  }
  function pauseCamera() {
    if (camState === 'running') { camState = 'paused'; video.pause(); }
  }
  function stopCamera() {
    camState = 'off';
    try { stream?.getTracks().forEach(t => t.stop()); } catch {}
    stream = null; track = null; video.srcObject = null;
    torchOn = false; $('#torch').hidden = true; $('#zoom').hidden = true;
  }
  function setupTools() {
    let caps = {};
    try { caps = track.getCapabilities?.() || {}; } catch {}
    $('#torch').hidden = !caps.torch;
    $('#torch').setAttribute('aria-pressed', 'false');
    const z = caps.zoom;
    zoomSteps = z ? [1, 2, 3].filter(v => v >= (z.min || 1) && v <= z.max) : [];
    zoomIdx = 0;
    $('#zoom').hidden = zoomSteps.length < 2;
    $('#zoom').textContent = '1×';
  }
  $('#torch').addEventListener('click', async () => {
    torchOn = !torchOn;
    try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch { torchOn = false; }
    $('#torch').setAttribute('aria-pressed', torchOn);
  });
  $('#zoom').addEventListener('click', async () => {
    zoomIdx = (zoomIdx + 1) % zoomSteps.length;
    try { await track.applyConstraints({ advanced: [{ zoom: zoomSteps[zoomIdx] }] }); } catch {}
    $('#zoom').textContent = zoomSteps[zoomIdx] + '×';
  });

  // Photo fallback: the phone's own camera takes a full-resolution still, which reads very long codes.
  $('#btn-photo').addEventListener('click', () => { $('#photo-input').value = ''; $('#photo-input').click(); });
  $('#photo-input').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    if (!file || !ZX) return;
    toast('Reading photo…');
    try {
      const res = (await ZX.readBarcodes(file, { ...READER, tryInvert: true, maxNumberOfSymbols: 16 }))
        .filter(r => r.isValid && r.text);
      const fits = res.filter(r => LOOKS[step]?.(r.text));
      const choices = [...new Set((fits.length ? fits : res).map(r => r.text))];
      if (!choices.length) { beep(false); toast('No barcode found. Move closer and keep the label sharp.'); }
      else if (choices.length === 1) { lastCode = ''; onDecode(choices[0]); }
      else {
        const pick = $('#pick');
        pick.innerHTML = `<div class="label">Found ${choices.length} codes. Tap the ${SCAN[step].name}:</div>` +
          choices.map((t, i) => `<button class="btn" type="button" data-i="${i}">${esc(t.length > 60 ? t.slice(0, 60) + '…' : t)}</button>`).join('');
        pick.hidden = false;
        pick.onclick = ev => {
          const b = ev.target.closest('[data-i]'); if (!b) return;
          pick.hidden = true; lastCode = ''; onDecode(choices[+b.dataset.i]);
        };
      }
    } catch { toast('Could not read that photo. Try again or use "Type it".'); }
    if (!$('#s-scan').hidden && step !== 'det' && (!track || track.readyState !== 'live')) { stopCamera(); startCamera(); }
  });

  // keep the screen on while scanning
  let wake = null;
  async function requestWake() { try { wake = await navigator.wakeLock?.request('screen'); } catch {} }
  function releaseWake() { try { wake?.release(); } catch {} wake = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !$('#s-scan').hidden) { requestWake(); if (step !== 'det') startCamera(); }
  });

  // ---------- boot ----------
  renderHome();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
